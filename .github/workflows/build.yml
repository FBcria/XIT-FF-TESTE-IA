name: build-xit

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Arch check
        run: uname -m && xcrun --sdk iphoneos --show-sdk-path && sw_vers

      - name: Install Theos + ldid (arm64 host)
        run: |
          export THEOS=$RUNNER_TEMP/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/bin"
          curl -sL https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_arm64 -o "$THEOS/bin/ldid"
          chmod +x "$THEOS/bin/ldid"
          "$THEOS/bin/ldid" -v || true

      - name: Force arm64 cross toolchain
        run: |
          echo "ARCHS=arm64" >> $GITHUB_ENV
          echo "TARGET=iphone:clang:latest:14.0" >> $GITHUB_ENV
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build dylib
        run: |
          make clean || true
          make -j4 ARCHS=arm64 TARGET=iphone:clang:latest:14.0

      - name: Verify output
        run: |
          file out/xit.dylib
          lipo -info out/xit.dylib
          codesign -d --entitlements :- out/xit.dylib 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xit-dylib
          path: out/xit.dylib
          if-no-files-found: error
